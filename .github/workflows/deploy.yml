name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing (and through it ChatGPT search / Copilot) that the sitemap URLs changed.
      # Non-fatal: a failed ping must never block a deploy.
      - name: Notify IndexNow
        continue-on-error: true
        env:
          KEY: 542b73cb65642da58bfaac39ef2481c7
        run: |
          for i in $(seq 1 12); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://mastalex.pl/$KEY.txt")" = 200 ] && break
            sleep 10
          done
          URLS=$(grep -o '<loc>[^<]*</loc>' public/sitemap.xml | sed -e 's/<[^>]*>//g' -e 's/.*/"&"/' | paste -sd, -)
          curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"mastalex.pl\",\"key\":\"$KEY\",\"keyLocation\":\"https://mastalex.pl/$KEY.txt\",\"urlList\":[$URLS]}"
